server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    #access_log  /var/log/nginx/host.access.log  main;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_vary on;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html =404;
    }

    # Hash-carrying filenames (esbuild chunk-HASH.js and Angular media-hashed assets, e.g. logo.a1b2c3d4.png)
    # can cache forever: a content change always produces a new filename.
    location ~* ^/chunk-[0-9A-Za-z]{6,}\.(js|css)$ {
        root   /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~* \.[0-9a-fA-F]{8,}\.(css|js|mjs|png|jpg|jpeg|gif|svg|webp|avif|ico|woff2?|ttf|eot)$ {
        root   /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Static-name files whose content changes without a filename change (main.js, polyfills.js, styles.css
    # keep fixed names here — outputHashing is "media" only) plus the service worker's own manifest files.
    location ~* ^/(main|polyfills)\.js$ {
        root   /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }
    location = /styles.css {
        root   /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }
    location ~* ^/(index\.html|ngsw\.json|ngsw-worker\.js|manifest\.webmanifest)$ {
        root   /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    #error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    # proxy the PHP scripts to Apache listening on 127.0.0.1:80
    #
    #location ~ \.php$ {
    #    proxy_pass   http://127.0.0.1;
    #}

    # pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
    #
    #location ~ \.php$ {
    #    root           html;
    #    fastcgi_pass   127.0.0.1:9000;
    #    fastcgi_index  index.php;
    #    fastcgi_param  SCRIPT_FILENAME  /scripts$fastcgi_script_name;
    #    include        fastcgi_params;
    #}

    # deny access to .htaccess files, if Apache's document root
    # concurs with nginx's one
    #
    #location ~ /\.ht {
    #    deny  all;
    #}
}
